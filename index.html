<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="eRental is an online rental marketplace for Iligan City. Find, list and request rentals in one place." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const preference = localStorage.getItem('erental-theme') || 'system';
        document.documentElement.dataset.theme = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <title>eRental – Rent almost anything in Iligan City</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
